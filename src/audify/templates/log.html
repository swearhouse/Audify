<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log - Bragi</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='bragi.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    >
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0e13;
        color: #edf1f7;
        --surface: #121720;
        --border: #252e3c;
        --muted: #8d9aab;
        --accent: #8de0bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(ellipse at 78% 0%, #18232a 0, #0b0e13 48rem);
        font-size: 14px;
        line-height: 1.5;
      }

      main {
        width: min(860px, 100%);
        margin: 0 auto;
        padding: 28px 18px;
      }

      .log-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .log-actions {
        display: flex;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      a.action,
      button.action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #1b2430;
        color: #e9eef5;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      a.action:hover,
      button.action:hover:not(:disabled) {
        border-color: #3b4a5d;
        background: #242f3d;
      }

      a.action:focus-visible,
      button.action:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button.action:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      #log-status {
        min-height: 20px;
        margin: 14px 4px 0;
        color: var(--muted);
        font-size: 13px;
      }

      #log-entries {
        display: grid;
        gap: 10px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }

      .log-entry {
        display: grid;
        gap: 4px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
      }

      .log-entry-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 12px;
      }

      .log-entry-title {
        overflow-wrap: anywhere;
        font-weight: 600;
      }

      .log-entry time,
      .log-entry-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .log-entry-reason {
        color: #f0a8a8;
      }

      .log-entry-detail {
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .log-entry a {
        overflow-wrap: anywhere;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="log-heading">
        <h1>Log</h1>
        <div class="log-actions">
          <button id="refresh-log" class="action" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
            <span>Refresh</span>
          </button>
          <button id="clear-log" class="action" type="button" disabled>
            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
            <span>Clear log</span>
          </button>
          <a class="action" href="{{ url_for('index') }}">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
            <span>Back to player</span>
          </a>
        </div>
      </div>
      <p id="log-status" role="status" aria-live="polite"></p>
      <ol id="log-entries" aria-label="Songs that could not be resolved"></ol>
    </main>
    <script>
      const logEntries = document.querySelector("#log-entries");
      const logStatus = document.querySelector("#log-status");
      const clearLogButton = document.querySelector("#clear-log");
      const refreshLogButton = document.querySelector("#refresh-log");

      function renderEntry(entry) {
        const item = document.createElement("li");
        item.classList.add("log-entry");

        const header = document.createElement("div");
        header.classList.add("log-entry-header");
        const title = document.createElement("span");
        title.classList.add("log-entry-title");
        title.textContent = entry.title || "Unknown song";
        const time = document.createElement("time");
        const date = new Date(entry.timestamp);
        time.dateTime = entry.timestamp;
        time.textContent = Number.isNaN(date.getTime())
          ? entry.timestamp
          : date.toLocaleString();
        header.append(title, time);

        const reason = document.createElement("span");
        reason.classList.add("log-entry-reason");
        reason.textContent = entry.reason;
        item.append(header, reason);

        if (entry.detail) {
          const detail = document.createElement("pre");
          detail.classList.add("log-entry-detail");
          detail.textContent = entry.detail;
          item.append(detail);
        }

        const meta = document.createElement("div");
        meta.classList.add("log-entry-meta");
        if (entry.playlist) {
          meta.append(`Playlist: ${entry.playlist} · `);
        }
        const link = document.createElement("a");
        link.href = entry.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = entry.url;
        meta.append(link);
        item.append(meta);
        return item;
      }

      async function loadLog() {
        logStatus.textContent = "Loading…";
        try {
          const response = await fetch("/api/log");
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not load the log.");
          }
          logEntries.replaceChildren(...result.entries.map(renderEntry));
          clearLogButton.disabled = result.entries.length === 0;
          logStatus.textContent = result.entries.length
            ? `${result.entries.length} unresolved song(s), newest first.`
            : "Nothing logged. Songs that cannot be resolved will show up here.";
        } catch (error) {
          logStatus.textContent = error.message;
        }
      }

      async function clearLog() {
        if (!window.confirm("Clear the whole log?")) {
          return;
        }
        try {
          const response = await fetch("/api/log", { method: "DELETE" });
          if (!response.ok) {
            throw new Error("Could not clear the log.");
          }
          await loadLog();
        } catch (error) {
          logStatus.textContent = error.message;
        }
      }

      refreshLogButton.addEventListener("click", loadLog);
      clearLogButton.addEventListener("click", clearLog);
      loadLog();
    </script>
  </body>
</html>
