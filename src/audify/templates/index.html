<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bragi</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='bragi.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    >
    <style>
      @property --ambient-color {
        syntax: "<color>";
        inherits: false;
        initial-value: #18232a;
      }

      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0e13;
        color: #edf1f7;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --surface: #121720;
        --surface-raised: #171e29;
        --border: #252e3c;
        --muted: #8d9aab;
        --accent: #8de0bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        --ambient-color: #18232a;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(ellipse at 78% 0%, var(--ambient-color) 0, #0b0e13 48rem);
        font-size: 14px;
        line-height: 1.5;
        transition: --ambient-color 1.2s ease;
      }

      form {
        display: flex;
        gap: 0.6rem;
      }

      input {
        min-width: 0;
        flex: 1;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        background: #0f141c;
        color: #edf1f7;
        font: inherit;
      }

      input:focus {
        border-color: #4a8d75;
        box-shadow: 0 0 0 3px #8de0bd1a;
      }

      input::placeholder {
        color: #697587;
      }

      button {
        min-height: 40px;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #1b2430;
        color: #e9eef5;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      button:hover:not(:disabled) {
        border-color: #3b4a5d;
        background: #242f3d;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      #playlist-editor {
        width: min(620px, calc(100% - 32px));
        max-height: 90vh;
        overflow-y: auto;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface-raised);
        color: #edf1f7;
      }

      #playlist-import-dialog {
        width: min(480px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface-raised);
        color: #edf1f7;
      }

      #playlist-import-dialog::backdrop {
        background: #05070bbf;
        backdrop-filter: blur(3px);
      }

      #playlist-import-dialog h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }

      .playlist-import-form {
        display: grid;
        gap: 12px;
      }

      .playlist-import-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      #video-add-dialog {
        width: min(480px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface-raised);
        color: #edf1f7;
      }

      #video-add-dialog::backdrop {
        background: #05070bbf;
        backdrop-filter: blur(3px);
      }

      #video-add-dialog h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }

      .video-add-form {
        display: grid;
        gap: 12px;
      }

      .video-add-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .song-playlist-choices {
        display: grid;
        gap: 8px;
        max-height: 180px;
        overflow-y: auto;
        margin: 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .song-playlist-choices legend {
        padding: 0 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .song-playlist-options {
        display: grid;
        gap: 6px;
      }

      .song-playlist-option {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .song-playlist-option input {
        width: 18px;
        flex: none;
        margin: 0;
        accent-color: var(--accent);
      }

      .song-playlist-empty {
        margin: 0;
        color: var(--muted);
      }

      #playlist-editor::backdrop {
        background: #05070bbf;
        backdrop-filter: blur(3px);
      }

      #playlist-editor h2 {
        margin: 0;
        font-size: 18px;
      }

      .playlist-editor-heading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .playlist-editor-heading-actions {
        display: flex;
        gap: 8px;
      }

      .playlist-editor-form,
      .playlist-editor-field {
        display: grid;
        gap: 10px;
      }

      .playlist-editor-field {
        gap: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .playlist-video-fields {
        display: grid;
        gap: 8px;
      }

      .playlist-video-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
      }

      .playlist-video-row input {
        width: 100%;
      }

      .playlist-video-link {
        min-width: 0;
        align-self: center;
        overflow-wrap: anywhere;
        color: var(--accent);
      }

      .playlist-editor-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
      }

      .playlist-editor-primary-actions {
        display: flex;
        gap: 8px;
      }

      .icon-button {
        display: inline-grid;
        width: 42px;
        min-width: 42px;
        place-items: center;
        padding: 0;
      }

      .material-symbols-outlined {
        font-family: "Material Symbols Outlined", sans-serif;
        font-size: 22px;
        font-weight: 500;
        line-height: 1;
        font-style: normal;
        font-variation-settings: "FILL" 0, "GRAD" 0, "opsz" 24;
        user-select: none;
      }

      .app-shell {
        display: grid;
        align-items: start;
        align-content: start;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 28px;
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 22px 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #10151de8;
      }

      .saved-library {
        flex: none;
        min-height: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0 8px 30px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #f2f5f8;
        font: inherit;
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -0.04em;
        text-align: left;
      }

      .brand:hover:not(:disabled) {
        border-color: transparent;
        background: transparent;
      }

      .sidebar.is-collapsed {
        padding-bottom: 16px;
      }

      .sidebar.is-collapsed .brand {
        margin-bottom: 0;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        flex: none;
        object-fit: cover;
      }

      .sidebar h2,
      .queue-heading h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .sidebar-label {
        margin: 0 8px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #playlist-status {
        min-height: 1.5em;
        margin: 4px 8px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      #add-playlist-button {
        width: 100%;
        margin: 0 0 10px;
      }

      #add-song-button {
        width: 100%;
        margin: 0 0 10px;
      }

      #import-playlist-button {
        width: 100%;
      }

      audio {
        width: 100%;
        margin-top: 22px;
        accent-color: var(--accent);
        color-scheme: dark;
        transition: --ambient-color 1.2s ease;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 22px;
      }

      .button-with-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .button-with-icon .material-symbols-outlined {
        font-size: 19px;
      }

      .player-card,
      .queue-card {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(145deg, #151c26, #11161e);
      }

      .player-card {
        padding: clamp(20px, 4vw, 34px);
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .now-playing {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      #current-thumbnail {
        display: block;
        width: 104px;
        height: 78px;
        flex: none;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0c1117;
        object-fit: cover;
      }

      #current-thumbnail[hidden] {
        display: none;
      }

      .now-playing-info {
        min-width: 0;
      }

      #status {
        min-height: 1.5em;
        margin: 0;
        overflow-wrap: anywhere;
        color: #c7d0dc;
        font-size: 15px;
      }

      .player-controls {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin-top: 20px;
      }

      #transport-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .seek-control {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      #seek-slider,
      #volume-slider {
        height: 8px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        appearance: none;
        -webkit-appearance: none;
        background: linear-gradient(
          to right,
          var(--ambient-color) 0%,
          var(--ambient-color) var(--slider-progress, 0%),
          var(--border) var(--slider-progress, 0%),
          var(--border) 100%
        );
        accent-color: var(--ambient-color);
        cursor: pointer;
      }

      #seek-slider {
        width: 100%;
      }

      #volume-slider {
        width: 112px;
        margin: 0;
      }

      #seek-slider::-webkit-slider-runnable-track,
      #volume-slider::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: transparent;
      }

      #seek-slider::-webkit-slider-thumb,
      #volume-slider::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -4px;
        appearance: none;
        -webkit-appearance: none;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #fff;
      }

      #seek-slider::-moz-range-track,
      #volume-slider::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: transparent;
      }

      #seek-slider::-moz-range-progress,
      #volume-slider::-moz-range-progress {
        height: 8px;
        border-radius: 999px;
        background: transparent;
      }

      #seek-slider::-moz-range-thumb,
      #volume-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #fff;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 150px;
        align-self: flex-start;
      }

      .volume-control label {
        color: var(--muted);
        white-space: nowrap;
      }

      #volume-value {
        min-width: 3ch;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .queue-card {
        display: flex;
        flex: none;
        flex-direction: column;
        padding: 22px;
      }

      .queue-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      #playlist-title {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        text-overflow: ellipsis;
        text-align: right;
        white-space: nowrap;
      }

      #tracks,
      #playlist-list {
        display: grid;
        gap: 5px;
        max-height: 360px;
        overflow-y: auto;
        padding: 0;
        list-style: none;
        scrollbar-color: #354152 transparent;
        scrollbar-width: thin;
      }

      #tracks {
        margin: 0;
      }

      #tracks li {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      #playlist-search {
        width: 100%;
        margin: 0 0 12px;
      }

      #track-search-status {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }

      #track-search-status[hidden] {
        display: none;
      }

      #playlist-list {
        margin: 0;
      }

      #tracks button,
      #playlist-list button {
        width: 100%;
        text-align: left;
      }

      #tracks button {
        display: flex;
        align-items: center;
        gap: 12px;
        border-color: transparent;
        background: transparent;
        color: #aeb9c8;
        font-weight: 500;
      }

      #tracks .track-select {
        width: auto;
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #tracks .track-select::before {
        width: 22px;
        color: #738195;
        content: attr(data-track-number);
        font-size: 12px;
        text-align: center;
      }

      #tracks button[aria-current="true"] {
        border-color: #283a36;
        background: #17251f;
        color: #b8f0d5;
      }

      #tracks button[aria-current="true"]::before {
        color: var(--accent);
      }

      #playlist-list li {
        display: flex;
        min-width: 0;
        max-width: 100%;
        align-items: center;
        gap: 3px;
      }

      #playlist-list .playlist-title {
        width: auto;
        min-width: 0;
        flex: 1;
        overflow: hidden;
        border-color: transparent;
        background: transparent;
        color: #bec8d5;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #playlist-list button:not(.playlist-title) {
        width: auto;
        flex: none;
        padding: 0.45rem 0.55rem;
        font-size: 11px;
      }

      .sidebar-note {
        margin: 12px 8px 0;
        color: #788597;
        font-size: 12px;
      }

      .account-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 16px 28px 0;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 820px) {
        .app-shell {
          grid-template-columns: 230px minmax(0, 1fr);
          gap: 18px;
          padding: 18px;
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 14px;
        }

        .sidebar {
          padding: 16px;
        }

        .brand {
          margin: 0 4px 18px;
        }

        .sidebar.is-collapsed .brand {
          margin: 0 4px;
        }

        #playlist-list {
          max-height: 180px;
        }

        .playlist-video-row {
          grid-template-columns: minmax(0, 1fr);
        }

        .sidebar-note {
          display: none;
        }

        .account-bar {
          padding: 12px 14px 0;
        }

        .workspace {
          gap: 8px;
          padding: 0;
        }

        .player-card,
        .queue-card {
          border-radius: 15px;
          padding: 18px;
        }

        #current-thumbnail {
          width: 88px;
          height: 66px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="account-bar">
      <span>Signed in as <strong>{{ username }}</strong></span>
      <button id="logout-button" class="button-with-icon" type="button" title="Log out">
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        <span>Log out</span>
      </button>
    </header>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Playlist library">
        <button
          id="sidebar-toggle"
          class="brand"
          type="button"
          aria-expanded="true"
          aria-controls="sidebar-content"
        ><img
          class="brand-mark"
          src="https://raw.githubusercontent.com/swearhouse/Audify/main/src/audify/static/bragi.png"
          alt=""
          aria-hidden="true"
        >Bragi</button>
        <div id="sidebar-content">
          <section class="saved-library" aria-label="Playlists">
            <p class="sidebar-label">Playlists</p>
            <p id="playlist-status" role="status" aria-live="polite"></p>
            <button id="add-song-button" type="button">Add Song</button>
            <button id="add-playlist-button" type="button">Add playlist</button>
            <ul id="playlist-list"></ul>
            <p class="sidebar-note">Your playlists are private to your account.</p>
          </section>
        </div>
      </aside>
      <section class="workspace" aria-label="Audio player">
        <section class="player-card" aria-label="Player controls">
          <div class="now-playing">
            <img id="current-thumbnail" alt="" aria-hidden="true" hidden>
            <div class="now-playing-info">
              <p class="eyebrow">Now playing</p>
              <p id="status" role="status" aria-live="polite">Load a playlist to start listening.</p>
            </div>
          </div>
          <audio id="player" hidden></audio>
          <div class="player-controls">
            <div id="transport-controls">
              <button id="previous-button" class="icon-button" type="button" disabled aria-label="Previous track" title="Previous track">
                <span class="material-symbols-outlined" aria-hidden="true">skip_previous</span>
              </button>
              <button id="play-pause-button" class="icon-button" type="button" disabled aria-label="Play" title="Play">
                <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
              </button>
              <button id="stop-button" class="icon-button" type="button" disabled aria-label="Stop" title="Stop">
                <span class="material-symbols-outlined" aria-hidden="true">stop</span>
              </button>
              <button id="next-button" class="icon-button" type="button" disabled aria-label="Next track" title="Next track">
                <span class="material-symbols-outlined" aria-hidden="true">skip_next</span>
              </button>
              <button
                id="shuffle-button"
                class="icon-button"
                type="button"
                disabled
                aria-label="Shuffle"
                title="Shuffle"
              ><span class="material-symbols-outlined" aria-hidden="true">shuffle</span></button>
              <button
                id="cast-button"
                class="icon-button"
                type="button"
                disabled
                title="Casting requires HTTPS; localhost is allowed."
                aria-label="Cast unavailable"
              ><span class="material-symbols-outlined" aria-hidden="true">cast</span></button>
            </div>
            <div class="seek-control">
              <output id="seek-current-time" for="seek-slider">0:00</output>
              <input
                id="seek-slider"
                type="range"
                min="0"
                max="0"
                step="0.1"
                value="0"
                aria-label="Seek"
                disabled
              >
              <span id="seek-duration">0:00</span>
            </div>
            <div class="volume-control">
              <label for="volume-slider">Volume</label>
              <input
                id="volume-slider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
              >
              <output id="volume-value" for="volume-slider">100%</output>
            </div>
          </div>
        </section>
        <section class="queue-card" aria-labelledby="queue-heading">
          <div class="queue-heading">
            <h2 id="queue-heading">Playlist</h2>
            <span id="playlist-title">No playlist loaded</span>
          </div>
          <input
            id="playlist-search"
            type="search"
            placeholder="Search tracks"
            aria-label="Search tracks in the current playlist"
            disabled
          >
          <p id="track-search-status" role="status" aria-live="polite" hidden></p>
          <ol id="tracks" aria-label="Playlist tracks"></ol>
        </section>
      </section>
    </main>
    <dialog id="playlist-editor" aria-labelledby="playlist-editor-heading">
      <form id="playlist-editor-form" class="playlist-editor-form">
        <div class="playlist-editor-heading-row">
          <h2 id="playlist-editor-heading">Add playlist</h2>
          <div class="playlist-editor-heading-actions">
            <button id="import-playlist-button" type="button">Import Playlist</button>
          </div>
        </div>
        <label class="playlist-editor-field" for="playlist-name">
          Playlist name
          <input id="playlist-name" type="text" maxlength="200" required>
        </label>
        <div id="playlist-video-fields" class="playlist-video-fields"></div>
        <p id="playlist-editor-status" role="status" aria-live="polite"></p>
        <div class="playlist-editor-actions">
          <button id="delete-playlist-button" type="button" hidden>Delete playlist</button>
          <div class="playlist-editor-primary-actions">
            <button id="cancel-playlist-button" type="button">Cancel</button>
            <button id="save-playlist-button" type="submit">Save playlist</button>
          </div>

    <script>
      window.castApiAvailable = false;
      window.__onGCastApiAvailable = (isAvailable) => {
        window.castApiAvailable = isAvailable;
        window.dispatchEvent(new Event("cast-sdk-ready"));
      };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script>
      const sidebar = document.querySelector(".sidebar");
      const sidebarToggle = document.querySelector("#sidebar-toggle");
      const sidebarContent = document.querySelector("#sidebar-content");
      const previousButton = document.querySelector("#previous-button");
      const nextButton = document.querySelector("#next-button");
      const shuffleButton = document.querySelector("#shuffle-button");
      const trackList = document.querySelector("#tracks");
      const playlistSearch = document.querySelector("#playlist-search");
      const trackSearchStatus = document.querySelector("#track-search-status");
      const status = document.querySelector("#status");
      const playlistTitle = document.querySelector("#playlist-title");
      const playlistStatus = document.querySelector("#playlist-status");
      const playlistList = document.querySelector("#playlist-list");
      const addSongButton = document.querySelector("#add-song-button");
      const addPlaylistButton = document.querySelector("#add-playlist-button");
      const playlistEditor = document.querySelector("#playlist-editor");
      const playlistEditorForm = document.querySelector("#playlist-editor-form");
      const playlistEditorHeading = document.querySelector("#playlist-editor-heading");
      const playlistNameInput = document.querySelector("#playlist-name");
      const playlistVideoFields = document.querySelector("#playlist-video-fields");
      const playlistEditorStatus = document.querySelector("#playlist-editor-status");
      const cancelPlaylistButton = document.querySelector("#cancel-playlist-button");
      const savePlaylistButton = document.querySelector("#save-playlist-button");
      const deletePlaylistButton = document.querySelector("#delete-playlist-button");
      const importPlaylistButton = document.querySelector("#import-playlist-button");
      const playlistImportDialog = document.querySelector("#playlist-import-dialog");
      const playlistImportForm = document.querySelector("#playlist-import-form");
      const playlistImportUrl = document.querySelector("#playlist-import-url");
      const submitPlaylistImport = document.querySelector("#submit-playlist-import");
      const cancelPlaylistImport = document.querySelector("#cancel-playlist-import");
      const videoAddDialog = document.querySelector("#video-add-dialog");
      const videoAddForm = document.querySelector("#video-add-form");
      const videoAddUrl = document.querySelector("#video-add-url");
      const songPlaylistOptions = document.querySelector("#song-playlist-options");
      const videoAddStatus = document.querySelector("#video-add-status");
      const submitVideoAdd = document.querySelector("#submit-video-add");
      const cancelVideoAdd = document.querySelector("#cancel-video-add");
      const player = document.querySelector("#player");
      const castButton = document.querySelector("#cast-button");
      const castIcon = castButton.querySelector(".material-symbols-outlined");
      const playPauseButton = document.querySelector("#play-pause-button");
      const playPauseIcon = playPauseButton.querySelector(".material-symbols-outlined");
      const stopButton = document.querySelector("#stop-button");
      const seekSlider = document.querySelector("#seek-slider");
      const seekCurrentTime = document.querySelector("#seek-current-time");
      const seekDuration = document.querySelector("#seek-duration");
      const volumeSlider = document.querySelector("#volume-slider");
      const volumeValue = document.querySelector("#volume-value");
      const maxAudioLoadRetries = 2;
      const audioLoadError = "The audio stream could not be loaded.";
      const currentThumbnail = document.querySelector("#current-thumbnail");
      const logoutButton = document.querySelector("#logout-button");
      const ambientColors = ["#241f2a", "#1e2925", "#29231f", "#202734", "#192a2a", "#27232a"];
      let tracks = [];
      let currentIndex = -1;
      let ambientColorIndex = -1;
      let playbackRequest = 0;
      let cancelMetadataWait = null;
      let currentPlaylistTitle = "";
      let currentPlaylistId = null;
      let playlists = [];
      let editingPlaylistId = null;
      let castContext = null;
      let castSession = null;
      let remotePlayer = null;
      let remotePlayerController = null;
      let castMediaReady = false;
      let castCompletionHandled = false;
      let castMediaSession = null;
      let castMediaUpdateListener = null;
      let resolvedMedia = null;
      let isSeeking = false;

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) {
          return "0:00";
        }
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
      }

      function updateSeekProgress(value, duration) {
        const progress = Number.isFinite(duration) && duration > 0
          ? Math.min(100, Math.max(0, (value / duration) * 100))
          : 0;
        seekSlider.style.setProperty("--slider-progress", `${progress}%`);
      }

      function updateVolumeProgress(volume) {
        volumeSlider.style.setProperty("--slider-progress", `${volume * 100}%`);
      }

      function updatePlaybackControls() {
        const casting = Boolean(castSession);
        const hasRemoteMedia = casting && remotePlayer && remotePlayer.isMediaLoaded;
        const hasLocalMedia = !casting && Boolean(resolvedMedia);
        const hasMedia = hasRemoteMedia || hasLocalMedia;
        const duration = hasRemoteMedia
          ? remotePlayer.duration
          : hasLocalMedia
            ? player.duration
            : 0;
        const currentTime = hasRemoteMedia
          ? remotePlayer.currentTime
          : hasLocalMedia
            ? player.currentTime
            : 0;
        const canSeek = hasRemoteMedia
          ? remotePlayer.canSeek
          : hasLocalMedia && Number.isFinite(duration) && duration > 0;

        playPauseButton.disabled = !hasMedia;
        stopButton.disabled = !hasMedia;
        const shouldPlay = hasRemoteMedia
          ? remotePlayer.isPaused
          : hasLocalMedia && player.paused;
        playPauseIcon.textContent = shouldPlay ? "play_arrow" : "pause";
        playPauseButton.setAttribute("aria-label", shouldPlay ? "Play" : "Pause");
        playPauseButton.title = shouldPlay ? "Play" : "Pause";
        seekSlider.disabled = !canSeek;
        seekSlider.max = String(Number.isFinite(duration) ? duration : 0);
        seekDuration.textContent = formatTime(duration);
        updateSeekProgress(isSeeking ? Number(seekSlider.value) : currentTime, duration);
        if (!isSeeking) {
          seekSlider.value = String(Number.isFinite(currentTime) ? currentTime : 0);
          seekCurrentTime.value = formatTime(currentTime);
          seekCurrentTime.textContent = seekCurrentTime.value;
        }
      }

      function onCastMediaStatusChanged(mediaSession) {
        if (
          castSession
          && mediaSession
          && castMediaReady
          && !castCompletionHandled
          && mediaSession.playerState === chrome.cast.media.PlayerState.IDLE
          && mediaSession.idleReason === chrome.cast.media.IdleReason.FINISHED
        ) {
          castCompletionHandled = true;
          castMediaReady = false;
          if (currentIndex < tracks.length - 1) {
            advanceTrack(currentIndex + 1);
          } else if (currentIndex >= 0) {
            status.textContent = "Playlist finished.";
          }
        }
      }

      function watchCastMediaSession(event) {
        const mediaSession = event && event.mediaSession
          ? event.mediaSession
          : castSession
            ? castSession.getMediaSession()
            : null;
        if (!mediaSession || mediaSession === castMediaSession) {
          return;
        }
        if (castMediaSession && castMediaUpdateListener) {
          castMediaSession.removeUpdateListener(castMediaUpdateListener);
        }
        castMediaSession = mediaSession;
        castMediaUpdateListener = () => onCastMediaStatusChanged(mediaSession);
        mediaSession.addUpdateListener(castMediaUpdateListener);
        onCastMediaStatusChanged(mediaSession);
      }

      function onRemotePlayerChanged() {
        updatePlaybackControls();
        if (remotePlayer && remotePlayer.title) {
          status.textContent = remotePlayer.title;
        }
        onCastMediaStatusChanged(castSession ? castSession.getMediaSession() : null);
      }

      function updateVolumeControl(volume) {
        if (!Number.isFinite(volume)) {
          return;
        }
        const normalizedVolume = Math.min(1, Math.max(0, volume));
        volumeSlider.value = String(normalizedVolume);
        updateVolumeProgress(normalizedVolume);
        volumeValue.value = `${Math.round(normalizedVolume * 100)}%`;
        volumeValue.textContent = volumeValue.value;
      }

      function syncCastVolume() {
        if (castSession) {
          const volume = castSession.getVolume();
          if (Number.isFinite(volume)) {
            updateVolumeControl(volume);
          }
        }
      }

      function onCastVolumeChanged() {
        syncCastVolume();
      }

      function updateCastUi() {
        const castLabel = castSession ? "Disconnect from Chromecast" : "Cast to Chromecast";
        castButton.disabled = !castContext;
        castIcon.textContent = castSession ? "cast_connected" : "cast";
        castButton.title = castContext
          ? castLabel
          : (window.isSecureContext
            ? "Casting is unavailable in this browser."
            : "Casting requires HTTPS; localhost is allowed.");
        castButton.setAttribute("aria-label", castContext ? castLabel : "Cast unavailable");
        updatePlaybackControls();
      }

      function loadCastMedia(media) {
        if (!castSession) {
          return;
        }

        const mediaInfo = new chrome.cast.media.MediaInfo(
          media.audioUrl,
          media.contentType,
        );
        const metadata = new chrome.cast.media.GenericMediaMetadata();
        metadata.title = media.title;
        if (media.thumbnailUrl) {
          metadata.images = [new chrome.cast.Image(media.thumbnailUrl)];
        }
        mediaInfo.metadata = metadata;

        const loadRequest = new chrome.cast.media.LoadRequest(mediaInfo);
        loadRequest.autoplay = true;
        castMediaReady = false;
        status.textContent = `Sending ${media.title} to Chromecast…`;
        castSession.loadMedia(loadRequest).then(
          () => {
            if (resolvedMedia === media && castSession) {
              watchCastMediaSession();
              castMediaReady = true;
              castCompletionHandled = false;
              status.textContent = media.title;
            }
          },
          () => {
            if (resolvedMedia === media && castSession) {
              status.textContent = `Could not cast ${media.title}. The Chromecast may not support this audio stream.`;
              castContext.endCurrentSession(true);
            }
          },
        );
      }

      async function playLocally(media) {
        const metadataLoaded = waitForMetadata();
        player.src = media.audioUrl;
        player.load();
        await metadataLoaded;
        player.currentTime = 0;
        await player.play();
        status.textContent = media.title;
      }

      function initializeCast() {
        if (!window.castApiAvailable || !window.cast || !window.cast.framework) {
          castButton.disabled = true;
          castButton.title = window.isSecureContext
            ? "Casting is unavailable in this browser."
            : "Casting requires HTTPS; localhost is allowed.";
          castButton.setAttribute("aria-label", "Cast unavailable");
          return;
        }

        castContext = cast.framework.CastContext.getInstance();
        remotePlayer = new cast.framework.RemotePlayer();
        remotePlayerController = new cast.framework.RemotePlayerController(remotePlayer);
        [
          cast.framework.RemotePlayerEventType.CURRENT_TIME_CHANGED,
          cast.framework.RemotePlayerEventType.DURATION_CHANGED,
          cast.framework.RemotePlayerEventType.IS_MEDIA_LOADED_CHANGED,
          cast.framework.RemotePlayerEventType.IS_PAUSED_CHANGED,
          cast.framework.RemotePlayerEventType.PLAYER_STATE_CHANGED,
          cast.framework.RemotePlayerEventType.CAN_SEEK_CHANGED,
        ].forEach((eventType) => {
          remotePlayerController.addEventListener(eventType, onRemotePlayerChanged);
        });
        castContext.setOptions({
          receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
        });
        castContext.addEventListener(
          cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
          (event) => {
            if (
              event.sessionState === cast.framework.SessionState.SESSION_STARTED
              || event.sessionState === cast.framework.SessionState.SESSION_RESUMED
            ) {
              castSession = castContext.getCurrentSession();
              castSession.addEventListener(
                cast.framework.SessionEventType.VOLUME_CHANGED,
                onCastVolumeChanged,
              );
              castSession.addEventListener(
                cast.framework.SessionEventType.MEDIA_SESSION,
                watchCastMediaSession,
              );
              watchCastMediaSession();
              updateCastUi();
              syncCastVolume();
              updatePlaybackControls();
              if (resolvedMedia) {
                player.pause();
                loadCastMedia(resolvedMedia);
              } else {
                status.textContent = "Connected to Chromecast. Select a track to play.";
              }
            } else if (
              event.sessionState === cast.framework.SessionState.SESSION_ENDED
            ) {
              castSession = null;
              updateCastUi();
              updateVolumeControl(player.volume);
              if (resolvedMedia) {
                playLocally(resolvedMedia).catch((error) => {
                  status.textContent = `Could not resume local playback: ${error.message}`;
                });
              }
            }
          },
        );
        castSession = castContext.getCurrentSession();
        if (castSession) {
          castSession.addEventListener(
            cast.framework.SessionEventType.VOLUME_CHANGED,
            onCastVolumeChanged,
          );
          castSession.addEventListener(
            cast.framework.SessionEventType.MEDIA_SESSION,
            watchCastMediaSession,
          );
          watchCastMediaSession();
          syncCastVolume();
        }
        updateCastUi();
      }

      window.addEventListener("cast-sdk-ready", initializeCast);
      initializeCast();

      castButton.addEventListener("click", async () => {
        try {
          if (castSession) {
            castContext.endCurrentSession(true);
          } else if (castContext) {
            await castContext.requestSession();
          }
        } catch (error) {
          status.textContent = `Could not connect to Chromecast: ${error.message}`;
        }
      });

      volumeSlider.addEventListener("input", () => {
        const volume = Number(volumeSlider.value);
        updateVolumeControl(volume);
        if (castSession) {
          castSession.setVolume(volume).catch(() => {
            status.textContent = "Could not change Chromecast volume.";
          });
        } else {
          player.volume = volume;
        }
      });

      playPauseButton.addEventListener("click", async () => {
        try {
          if (castSession) {
            if (remotePlayer && remotePlayer.isMediaLoaded) {
              remotePlayerController.playOrPause();
            }
          } else if (player.paused) {
            await player.play();
          } else {
            player.pause();
          }
        } catch (error) {
          status.textContent = `Could not change playback: ${error.message}`;
        }
      });
      stopButton.addEventListener("click", () => {
        if (castSession) {
          if (remotePlayer && remotePlayer.isMediaLoaded) {
            remotePlayerController.stop();
          }
        } else if (resolvedMedia) {
          player.pause();
          player.currentTime = 0;
          status.textContent = "Stopped.";
        }
      });
      seekSlider.addEventListener("input", () => {
        isSeeking = true;
        const seekTime = Number(seekSlider.value);
        seekCurrentTime.value = formatTime(seekTime);
        seekCurrentTime.textContent = seekCurrentTime.value;
        updateSeekProgress(seekTime, Number(seekSlider.max));
      });
      seekSlider.addEventListener("change", () => {
        const seekTime = Number(seekSlider.value);
        isSeeking = false;
        if (castSession && remotePlayer && remotePlayer.isMediaLoaded) {
          remotePlayer.currentTime = seekTime;
          remotePlayerController.seek();
        } else if (resolvedMedia && Number.isFinite(player.duration)) {
          player.currentTime = seekTime;
          updatePlaybackControls();
        }
      });
      player.addEventListener("volumechange", () => {
        if (!castSession) {
          updateVolumeControl(player.volume);
        }
      });
      [
        "durationchange",
        "loadedmetadata",
        "pause",
        "play",
        "timeupdate",
      ].forEach((eventType) => {
        player.addEventListener(eventType, updatePlaybackControls);
      });
      updateVolumeControl(player.volume);
      updatePlaybackControls();

      logoutButton.addEventListener("click", async () => {
        try {
          const response = await fetch("/api/logout", { method: "POST" });
          if (!response.ok) {
            throw new Error("Could not sign out.");
          }
          window.location.assign("/login");
        } catch (error) {
          status.textContent = error.message;
        }
      });

      sidebarToggle.addEventListener("click", () => {
        const expanded = sidebarToggle.getAttribute("aria-expanded") === "true";
        sidebarToggle.setAttribute("aria-expanded", String(!expanded));
        sidebar.classList.toggle("is-collapsed", expanded);
        sidebarContent.hidden = expanded;
      });

      function shiftAmbientColor() {
        ambientColorIndex = (ambientColorIndex + 1) % ambientColors.length;
        const ambientColor = ambientColors[ambientColorIndex];
        document.body.style.setProperty("--ambient-color", ambientColor);
        player.style.setProperty("--ambient-color", ambientColor);
        seekSlider.style.setProperty("--ambient-color", ambientColor);
        volumeSlider.style.setProperty("--ambient-color", ambientColor);
      }

      function selectTrack(index) {
        if (index >= 0 && index < tracks.length && index !== currentIndex) {
          shiftAmbientColor();
        }
        playTrack(index);
      }

      function advanceTrack(index) {
        if (index >= 0 && index < tracks.length && index !== currentIndex) {
          shiftAmbientColor();
        }
        playTrack(index);
      }

      function renderTracks() {
        trackList.replaceChildren();
        const query = playlistSearch.value.trim().toLocaleLowerCase();
        const matchingTracks = tracks
          .map((track, index) => ({ track, index }))
          .filter(({ track }) => track.title.toLocaleLowerCase().includes(query));

        matchingTracks.forEach(({ track, index }) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.classList.add("track-select");
          button.textContent = track.title;
          button.setAttribute("data-track-number", String(index + 1));
          button.setAttribute("aria-current", String(index === currentIndex));
          button.addEventListener("click", () => selectTrack(index));
          item.append(button);
          trackList.append(item);
        });
        trackSearchStatus.hidden = !query || matchingTracks.length > 0;
        trackSearchStatus.textContent = query
          ? `No tracks found for “${playlistSearch.value.trim()}”.`
          : "";
        previousButton.disabled = currentIndex <= 0;
        nextButton.disabled = currentIndex < 0 || currentIndex >= tracks.length - 1;
        shuffleButton.disabled = tracks.length < 2;
        playlistSearch.disabled = tracks.length === 0;
      }

      function shuffleTracks() {
        const currentTrack = currentIndex >= 0 ? tracks[currentIndex] : null;
        for (let index = tracks.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [tracks[index], tracks[randomIndex]] = [tracks[randomIndex], tracks[index]];
        }
        if (currentTrack) {
          currentIndex = tracks.indexOf(currentTrack);
        }
        renderTracks();
      }

      function clearPlayer() {
        if (cancelMetadataWait) {
          cancelMetadataWait();
        }
        player.pause();
        player.removeAttribute("src");
        player.load();
      }

      function waitForMetadata() {
        return new Promise((resolve, reject) => {
          function cleanup() {
            player.removeEventListener("loadedmetadata", onLoadedMetadata);
            player.removeEventListener("error", onError);
            if (cancelMetadataWait === cancel) {
              cancelMetadataWait = null;
            }
          }

          function onLoadedMetadata() {
            cleanup();
            resolve();
          }

          function onError() {
            cleanup();
            reject(new Error("The audio stream could not be loaded."));
          }

          function cancel() {
            cleanup();
            reject(new Error("Playback was replaced."));
          }

          cancelMetadataWait = cancel;
          player.addEventListener("loadedmetadata", onLoadedMetadata);
          player.addEventListener("error", onError);
        });
      }

      async function playTrack(index, retryCount = 0) {
        if (index < 0 || index >= tracks.length) {
          return;
        }
        const track = tracks[index];
        const requestId = ++playbackRequest;
        currentIndex = index;
        resolvedMedia = null;
        renderTracks();
        clearPlayer();
        currentThumbnail.hidden = true;
        currentThumbnail.removeAttribute("src");
        if (track.thumbnail_url) {
          currentThumbnail.dataset.thumbnailUrl = track.thumbnail_url;
          currentThumbnail.onload = () => {
            if (currentThumbnail.dataset.thumbnailUrl === track.thumbnail_url) {
              currentThumbnail.hidden = false;
            }
          };
          currentThumbnail.onerror = () => {
            if (currentThumbnail.dataset.thumbnailUrl === track.thumbnail_url) {
              currentThumbnail.hidden = true;
            }
          };
          currentThumbnail.src = track.thumbnail_url;
        } else {
          delete currentThumbnail.dataset.thumbnailUrl;
          currentThumbnail.onload = null;
          currentThumbnail.onerror = null;
        }
        status.textContent = `Resolving ${track.title}…`;

        try {
          const response = await fetch("/api/resolve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: track.url }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not resolve that track.");
          }
          if (requestId !== playbackRequest) {
            return;
          }

          resolvedMedia = {
            audioUrl: result.audio_url,
            contentType: result.content_type || "audio/mpeg",
            title: result.title,
            thumbnailUrl: track.thumbnail_url,
          };
          if (castSession) {
            player.pause();
            loadCastMedia(resolvedMedia);
            return;
          }

          const metadataLoaded = waitForMetadata();
          player.src = resolvedMedia.audioUrl;
          player.load();
          await metadataLoaded;
          if (requestId !== playbackRequest) {
            return;
          }
          player.currentTime = 0;
          await player.play();
          if (requestId === playbackRequest) {
            status.textContent = resolvedMedia.title;
            updatePlaybackControls();
          }
        } catch (error) {
          if (requestId === playbackRequest) {
            if (error.message === audioLoadError && retryCount < maxAudioLoadRetries) {
              status.textContent = `Retrying ${track.title} (${retryCount + 1}/${maxAudioLoadRetries})…`;
              await playTrack(index, retryCount + 1);
            } else if (error.message === audioLoadError && index < tracks.length - 1) {
              advanceTrack(index + 1);
            } else {
              status.textContent = `${track.title}: ${error.message}`;
            }
          }
        }
      }

      function loadPlaylist(playlist) {
        const playbackContinues = castSession
          ? Boolean(remotePlayer && remotePlayer.isMediaLoaded && !remotePlayer.isPaused)
          : Boolean(resolvedMedia && !player.paused && !player.ended);
        ++playbackRequest;
        tracks = playlist.videos.map((video) => ({
          title: video.name,
          url: video.link,
          thumbnail_url: null,
        }));
        currentIndex = -1;
        playlistSearch.value = "";
        trackSearchStatus.hidden = true;
        trackSearchStatus.textContent = "";
        currentPlaylistTitle = playlist.name;
        currentPlaylistId = playlist.id;
        playlistTitle.textContent = `${currentPlaylistTitle} (${tracks.length} songs)`;
        renderTracks();
        updatePlaybackControls();
        if (!playbackContinues) {
          status.textContent = `${currentPlaylistTitle} — ${tracks.length} tracks`;
        }
      }

      async function refreshPlaylists() {
        const response = await fetch("/api/playlists");
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Could not load playlists.");
        }

        playlists = result.playlists;
        renderPlaylists();
        playlistStatus.textContent = playlists.length
          ? `${playlists.length} playlist(s).`
          : "No playlists yet. Add one to get started.";
      }

      function renderPlaylists() {
        playlistList.replaceChildren();
        playlists.forEach((playlist) => {
          const item = document.createElement("li");
          const openButton = document.createElement("button");
          openButton.type = "button";
          openButton.classList.add("playlist-title");
          openButton.textContent = playlist.name;
          openButton.addEventListener("click", () => loadPlaylist(playlist));

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "Edit";
          editButton.setAttribute("aria-label", `Edit ${playlist.name}`);
          editButton.addEventListener("click", () => openPlaylistEditor(playlist));

          item.append(openButton, editButton);
          playlistList.append(item);
        });
      }

      function addVideoEditorRow(video = { name: "", link: "" }) {
        const row = document.createElement("div");
        row.classList.add("playlist-video-row");
        row.dataset.videoName = video.name;
        row.dataset.videoLink = video.link;
        const videoLink = document.createElement("a");
        videoLink.classList.add("playlist-video-link");
        videoLink.href = video.link;
        videoLink.target = "_blank";
        videoLink.rel = "noopener noreferrer";
        videoLink.textContent = video.name;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "Remove";
        removeButton.setAttribute("aria-label", "Remove video");
        removeButton.addEventListener("click", () => row.remove());
        row.append(videoLink, removeButton);
        playlistVideoFields.append(row);
        return row;
      }

      function openPlaylistEditor(playlist = null) {
        editingPlaylistId = playlist ? playlist.id : null;
        playlistEditorHeading.textContent = playlist ? "Edit playlist" : "Add playlist";
        deletePlaylistButton.hidden = !playlist;
        playlistNameInput.value = playlist ? playlist.name : "";
        playlistEditorStatus.textContent = "";
        playlistVideoFields.replaceChildren();
        (playlist ? playlist.videos : [])
          .forEach(addVideoEditorRow);
        playlistEditor.showModal();
        playlistNameInput.focus();
      }

      function renderSongPlaylistChoices() {
        songPlaylistOptions.replaceChildren();
        if (!playlists.length) {
          const emptyMessage = document.createElement("p");
          emptyMessage.classList.add("song-playlist-empty");
          emptyMessage.textContent = "Create a playlist before adding a song.";
          songPlaylistOptions.append(emptyMessage);
          return;
        }

        playlists.forEach((playlist) => {
          const label = document.createElement("label");
          label.classList.add("song-playlist-option");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = "playlist";
          checkbox.value = playlist.id;
          const name = document.createElement("span");
          name.textContent = playlist.name;
          label.append(checkbox, name);
          songPlaylistOptions.append(label);
        });
      }

      async function openAddSongDialog() {
        videoAddForm.reset();
        videoAddStatus.textContent = "";
        songPlaylistOptions.replaceChildren();
        const loadingMessage = document.createElement("p");
        loadingMessage.classList.add("song-playlist-empty");
        loadingMessage.textContent = "Loading playlists…";
        songPlaylistOptions.append(loadingMessage);
        videoAddDialog.showModal();
        videoAddUrl.focus();
        try {
          await refreshPlaylists();
          renderSongPlaylistChoices();
        } catch (error) {
          videoAddStatus.textContent = error.message;
          songPlaylistOptions.replaceChildren();
        }
      }

      async function addSongToSelectedPlaylists(event) {
        event.preventDefault();
        submitVideoAdd.disabled = true;
        const playlistIds = Array.from(
          songPlaylistOptions.querySelectorAll('input[name="playlist"]:checked'),
          (checkbox) => checkbox.value,
        );
        if (!playlistIds.length) {
          videoAddStatus.textContent = "Select at least one playlist.";
          submitVideoAdd.disabled = false;
          return;
        }
        videoAddStatus.textContent = "Looking up song and saving to playlists…";
        try {
          const titleResponse = await fetch("/api/videos/title", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: videoAddUrl.value.trim() }),
          });
          const titleResult = await titleResponse.json();
          if (!titleResponse.ok) {
            throw new Error(titleResult.error || "Could not get the song title.");
          }
          const response = await fetch("/api/playlists/add-song", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ playlist_ids: playlistIds, video: titleResult.video }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not add the song to those playlists.");
          }
          videoAddDialog.close();
          videoAddForm.reset();
          try {
            await refreshPlaylists();
            playlistStatus.textContent =
              `Added "${titleResult.video.name}" to ${playlistIds.length} playlist(s).`;
          } catch (error) {
            playlistStatus.textContent =
              `Song added, but the playlist list could not refresh: ${error.message}`;
          }
        } catch (error) {
          videoAddStatus.textContent = error.message;
        } finally {
          submitVideoAdd.disabled = false;
        }
      }

      async function persistPlaylist(closeEditor) {
        savePlaylistButton.disabled = true;
        const videos = Array.from(
          playlistVideoFields.querySelectorAll(".playlist-video-row"),
          (row) => ({ name: row.dataset.videoName, link: row.dataset.videoLink }),
        );
        const method = editingPlaylistId ? "PUT" : "POST";
        const endpoint = editingPlaylistId
          ? `/api/playlists/${encodeURIComponent(editingPlaylistId)}`
          : "/api/playlists";
        try {
          const response = await fetch(endpoint, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: playlistNameInput.value.trim(), videos }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not save the playlist.");
          }
          editingPlaylistId = result.playlist.id;
          playlistEditorHeading.textContent = "Edit playlist";
          deletePlaylistButton.hidden = false;
          if (currentPlaylistId === result.playlist.id) {
            currentPlaylistTitle = result.playlist.name;
            playlistTitle.textContent = `${currentPlaylistTitle} (${tracks.length} songs)`;
          }
          let refreshError = null;
          try {
            await refreshPlaylists();
          } catch (error) {
            refreshError = error;
          }
          if (closeEditor) {
            playlistEditor.close();
          }
          if (refreshError) {
            playlistStatus.textContent =
              `Playlist saved, but the playlist list could not refresh: ${refreshError.message}`;
          } else if (closeEditor) {
            playlistStatus.textContent = "Playlist saved.";
          }
          return result.playlist;
        } finally {
          savePlaylistButton.disabled = false;
        }
      }

      async function savePlaylist(event) {
        event.preventDefault();
        try {
          await persistPlaylist(true);
        } catch (error) {
          playlistStatus.textContent = error.message;
        }
      }

      async function deletePlaylist(playlist) {
        if (!window.confirm(`Delete "${playlist.name}"?`)) {
          return;
        }
        try {
          const response = await fetch(
            `/api/playlists/${encodeURIComponent(playlist.id)}`,
            { method: "DELETE" },
          );
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not delete the playlist.");
          }
          await refreshPlaylists();
          playlistEditor.close();
          playlistStatus.textContent = "Playlist deleted.";
        } catch (error) {
          playlistEditorStatus.textContent = error.message;
        }
      }

      async function importPlaylist(event) {
        event.preventDefault();
        submitPlaylistImport.disabled = true;
        playlistStatus.textContent = "Importing playlist…";
        try {
          const response = await fetch("/api/playlists/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: playlistImportUrl.value.trim() }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not import the playlist.");
          }
          playlistImportDialog.close();
          playlistImportForm.reset();
          await refreshPlaylists();
          playlistStatus.textContent =
            `Imported "${result.playlist.name}" (${result.playlist.videos.length} videos).`;
        } catch (error) {
          playlistStatus.textContent = error.message;
        } finally {
          submitPlaylistImport.disabled = false;
        }
      }

      addSongButton.addEventListener("click", openAddSongDialog);
      addPlaylistButton.addEventListener("click", () => openPlaylistEditor());
      cancelVideoAdd.addEventListener("click", () => videoAddDialog.close());
      videoAddForm.addEventListener("submit", addSongToSelectedPlaylists);
      cancelPlaylistButton.addEventListener("click", () => playlistEditor.close());
      playlistEditorForm.addEventListener("submit", savePlaylist);
      deletePlaylistButton.addEventListener("click", () => {
        if (editingPlaylistId) {
          deletePlaylist({ id: editingPlaylistId, name: playlistNameInput.value.trim() });
        }
      });
      importPlaylistButton.addEventListener("click", () => {
        playlistImportDialog.showModal();
        playlistImportUrl.focus();
      });
      cancelPlaylistImport.addEventListener("click", () => playlistImportDialog.close());
      playlistImportForm.addEventListener("submit", importPlaylist);

      previousButton.addEventListener("click", () => selectTrack(currentIndex - 1));
      nextButton.addEventListener("click", () => selectTrack(currentIndex + 1));
      shuffleButton.addEventListener("click", shuffleTracks);
      playlistSearch.addEventListener("input", renderTracks);
      player.addEventListener("ended", () => {
        if (currentIndex < tracks.length - 1) {
          advanceTrack(currentIndex + 1);
        } else if (currentIndex >= 0) {
          status.textContent = "Playlist finished.";
        }
      });

      refreshPlaylists().catch((error) => {
        playlistStatus.textContent = error.message;
      });
    </script>
  </body>
</html>
