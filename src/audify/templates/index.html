<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bragi</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='bragi.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    >
    <style>
      @property --ambient-color {
        syntax: "<color>";
        inherits: false;
        initial-value: #18232a;
      }

      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0e13;
        color: #edf1f7;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --surface: #121720;
        --surface-raised: #171e29;
        --border: #252e3c;
        --muted: #8d9aab;
        --accent: #8de0bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        --ambient-color: #18232a;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(ellipse at 78% 0%, var(--ambient-color) 0, #0b0e13 48rem);
        font-size: 14px;
        line-height: 1.5;
        transition: --ambient-color 1.2s ease;
      }

      form {
        display: flex;
        gap: 0.6rem;
      }

      input {
        min-width: 0;
        flex: 1;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        background: #0f141c;
        color: #edf1f7;
        font: inherit;
      }

      input:focus {
        border-color: #4a8d75;
        box-shadow: 0 0 0 3px #8de0bd1a;
      }

      input::placeholder {
        color: #697587;
      }

      button {
        min-height: 40px;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #1b2430;
        color: #e9eef5;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      button:hover:not(:disabled) {
        border-color: #3b4a5d;
        background: #242f3d;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .icon-button {
        display: inline-grid;
        width: 42px;
        min-width: 42px;
        place-items: center;
        padding: 0;
      }

      .material-symbols-outlined {
        font-family: "Material Symbols Outlined", sans-serif;
        font-size: 22px;
        font-weight: 500;
        line-height: 1;
        font-style: normal;
        font-variation-settings: "FILL" 0, "GRAD" 0, "opsz" 24;
        user-select: none;
      }

      .app-shell {
        display: grid;
        align-items: start;
        align-content: start;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 28px;
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 22px 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #10151de8;
      }

      .saved-library {
        flex: none;
        min-height: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0 8px 30px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #f2f5f8;
        font: inherit;
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -0.04em;
        text-align: left;
      }

      .brand:hover:not(:disabled) {
        border-color: transparent;
        background: transparent;
      }

      .sidebar.is-collapsed {
        padding-bottom: 16px;
      }

      .sidebar.is-collapsed .brand {
        margin-bottom: 0;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        flex: none;
        object-fit: cover;
      }

      .sidebar h2,
      .queue-heading h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .sidebar-divider {
        width: 100%;
        margin: 18px 0;
        border: 0;
        border-top: 1px solid var(--border);
      }

      .sidebar .add-playlist-heading {
        margin: 0 0 12px 8px;
      }

      .sidebar-label {
        margin: 0 8px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #saved-status {
        min-height: 1.5em;
        margin: 4px 8px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      audio {
        width: 100%;
        margin-top: 22px;
        accent-color: var(--accent);
        color-scheme: dark;
        transition: --ambient-color 1.2s ease;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 22px;
      }

      #url-form {
        display: grid;
        width: 100%;
        gap: 10px;
        margin: 0 0 22px;
      }

      #url {
        width: 100%;
        box-sizing: border-box;
        padding: 0.7rem 0.65rem;
        font-size: 12px;
      }

      .sidebar-actions {
        display: flex;
        gap: 8px;
      }

      .sidebar-actions button {
        min-width: 0;
        flex: 1;
      }

      .button-with-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .button-with-icon .material-symbols-outlined {
        font-size: 19px;
      }

      #load-button,
      #save-button {
        border-color: #8de0bd;
        background: var(--accent);
        color: #12221b;
      }

      #load-button:hover:not(:disabled),
      #save-button:hover:not(:disabled) {
        border-color: #a9efd1;
        background: #a9efd1;
      }

      .player-card,
      .queue-card {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(145deg, #151c26, #11161e);
      }

      .player-card {
        padding: clamp(20px, 4vw, 34px);
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .now-playing {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      #current-thumbnail {
        display: block;
        width: 104px;
        height: 78px;
        flex: none;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0c1117;
        object-fit: cover;
      }

      #current-thumbnail[hidden] {
        display: none;
      }

      .now-playing-info {
        min-width: 0;
      }

      #status {
        min-height: 1.5em;
        margin: 0;
        overflow-wrap: anywhere;
        color: #c7d0dc;
        font-size: 15px;
      }

      .player-controls {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin-top: 20px;
      }

      #transport-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .seek-control {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      #seek-slider,
      #volume-slider {
        height: 8px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        appearance: none;
        -webkit-appearance: none;
        background: linear-gradient(
          to right,
          var(--ambient-color) 0%,
          var(--ambient-color) var(--slider-progress, 0%),
          var(--border) var(--slider-progress, 0%),
          var(--border) 100%
        );
        accent-color: var(--ambient-color);
        cursor: pointer;
      }

      #seek-slider {
        width: 100%;
      }

      #volume-slider {
        width: 112px;
        margin: 0;
      }

      #seek-slider::-webkit-slider-runnable-track,
      #volume-slider::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: transparent;
      }

      #seek-slider::-webkit-slider-thumb,
      #volume-slider::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -4px;
        appearance: none;
        -webkit-appearance: none;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #fff;
      }

      #seek-slider::-moz-range-track,
      #volume-slider::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: transparent;
      }

      #seek-slider::-moz-range-progress,
      #volume-slider::-moz-range-progress {
        height: 8px;
        border-radius: 999px;
        background: transparent;
      }

      #seek-slider::-moz-range-thumb,
      #volume-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #fff;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 150px;
        align-self: flex-start;
      }

      .volume-control label {
        color: var(--muted);
        white-space: nowrap;
      }

      #volume-value {
        min-width: 3ch;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      #randomize-button {
        white-space: nowrap;
      }

      .queue-card {
        display: flex;
        flex: none;
        flex-direction: column;
        padding: 22px;
      }

      .queue-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      #playlist-title {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        text-overflow: ellipsis;
        text-align: right;
        white-space: nowrap;
      }

      #tracks,
      #saved-playlists {
        display: grid;
        gap: 5px;
        max-height: 360px;
        overflow-y: auto;
        padding: 0;
        list-style: none;
        scrollbar-color: #354152 transparent;
        scrollbar-width: thin;
      }

      #tracks {
        margin: 0;
      }

      #playlist-search {
        width: 100%;
        margin: 0 0 12px;
      }

      #track-search-status {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }

      #track-search-status[hidden] {
        display: none;
      }

      #saved-playlists {
        margin: 0;
      }

      #tracks button,
      #saved-playlists button {
        width: 100%;
        text-align: left;
      }

      #tracks button {
        display: flex;
        align-items: center;
        gap: 12px;
        border-color: transparent;
        background: transparent;
        color: #aeb9c8;
        font-weight: 500;
      }

      #tracks button::before {
        width: 22px;
        color: #738195;
        content: attr(data-track-number);
        font-size: 12px;
        text-align: center;
      }

      #tracks button[aria-current="true"] {
        border-color: #283a36;
        background: #17251f;
        color: #b8f0d5;
      }

      #tracks button[aria-current="true"]::before {
        color: var(--accent);
      }

      #saved-playlists li {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      #saved-playlists li button:first-child {
        width: auto;
        min-width: 0;
        flex: 1;
        overflow: hidden;
        border-color: transparent;
        background: transparent;
        color: #bec8d5;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #saved-playlists li button:last-child {
        display: inline-grid;
        width: 36px;
        flex: none;
        min-height: 34px;
        padding: 0;
        place-items: center;
        color: #8996a8;
      }

      .sidebar-note {
        margin: 12px 8px 0;
        color: #788597;
        font-size: 12px;
      }

      .account-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 16px 28px 0;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 820px) {
        .app-shell {
          grid-template-columns: 230px minmax(0, 1fr);
          gap: 18px;
          padding: 18px;
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 14px;
        }

        .sidebar {
          padding: 16px;
        }

        .brand {
          margin: 0 4px 18px;
        }

        .sidebar.is-collapsed .brand {
          margin: 0 4px;
        }

        #saved-playlists {
          max-height: 180px;
        }

        .sidebar-note {
          display: none;
        }

        .account-bar {
          padding: 12px 14px 0;
        }

        .workspace {
          gap: 8px;
          padding: 0;
        }

        #url-form {
          width: 100%;
        }

        .player-card,
        .queue-card {
          border-radius: 15px;
          padding: 18px;
        }

        #current-thumbnail {
          width: 88px;
          height: 66px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="account-bar">
      <span>Signed in as <strong>{{ username }}</strong></span>
      <button id="logout-button" class="button-with-icon" type="button" title="Log out">
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
        <span>Log out</span>
      </button>
    </header>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Playlist library">
        <button
          id="sidebar-toggle"
          class="brand"
          type="button"
          aria-expanded="true"
          aria-controls="sidebar-content"
        ><img
          class="brand-mark"
          src="https://raw.githubusercontent.com/swearhouse/Audify/main/src/audify/static/bragi.png"
          alt=""
          aria-hidden="true"
        >Bragi</button>
        <div id="sidebar-content">
          <section class="saved-library" aria-label="Saved playlists">
            <p class="sidebar-label">Your library</p>
            <p id="saved-status" role="status" aria-live="polite"></p>
            <ul id="saved-playlists"></ul>
            <p class="sidebar-note">Your playlists are saved on this device.</p>
          </section>
          <hr class="sidebar-divider">
          <h2 class="add-playlist-heading">Add playlist</h2>
          <form id="url-form">
            <input
              id="url"
              name="url"
              type="url"
              placeholder="Paste a YouTube URL"
              aria-label="YouTube playlist or video URL"
              required
            >
            <div class="sidebar-actions">
              <button id="load-button" class="button-with-icon" type="submit" title="Load playlist">
                <span class="material-symbols-outlined" aria-hidden="true">playlist_play</span>
                <span>Load</span>
              </button>
              <button id="save-button" class="button-with-icon" type="button" disabled title="Save playlist">
                <span class="material-symbols-outlined" aria-hidden="true">bookmark_add</span>
                <span>Save</span>
              </button>
            </div>
          </form>
        </div>
      </aside>
      <section class="workspace" aria-label="Audio player">
        <section class="player-card" aria-label="Player controls">
          <div class="now-playing">
            <img id="current-thumbnail" alt="" aria-hidden="true" hidden>
            <div class="now-playing-info">
              <p class="eyebrow">Now playing</p>
              <p id="status" role="status" aria-live="polite">Load a playlist to start listening.</p>
            </div>
          </div>
          <audio id="player" hidden></audio>
          <div class="player-controls">
            <div id="transport-controls">
              <button id="previous-button" class="icon-button" type="button" disabled aria-label="Previous track" title="Previous track">
                <span class="material-symbols-outlined" aria-hidden="true">skip_previous</span>
              </button>
              <button id="play-pause-button" class="icon-button" type="button" disabled aria-label="Play" title="Play">
                <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
              </button>
              <button id="stop-button" class="icon-button" type="button" disabled aria-label="Stop" title="Stop">
                <span class="material-symbols-outlined" aria-hidden="true">stop</span>
              </button>
              <button id="next-button" class="icon-button" type="button" disabled aria-label="Next track" title="Next track">
                <span class="material-symbols-outlined" aria-hidden="true">skip_next</span>
              </button>
              <button
                id="cast-button"
                class="icon-button"
                type="button"
                disabled
                title="Casting requires HTTPS; localhost is allowed."
                aria-label="Cast unavailable"
              ><span class="material-symbols-outlined" aria-hidden="true">cast</span></button>
            </div>
            <div class="seek-control">
              <output id="seek-current-time" for="seek-slider">0:00</output>
              <input
                id="seek-slider"
                type="range"
                min="0"
                max="0"
                step="0.1"
                value="0"
                aria-label="Seek"
                disabled
              >
              <span id="seek-duration">0:00</span>
            </div>
            <div class="volume-control">
              <label for="volume-slider">Volume</label>
              <input
                id="volume-slider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="Volume"
              >
              <output id="volume-value" for="volume-slider">100%</output>
            </div>
          </div>
        </section>
        <section class="queue-card" aria-labelledby="queue-heading">
          <div class="queue-heading">
            <h2 id="queue-heading">Playlist</h2>
            <span id="playlist-title">No playlist loaded</span>
            <button
              id="randomize-button"
              class="icon-button"
              type="button"
              disabled
              title="Shuffle playlist"
              aria-label="Shuffle playlist"
            >
              <span class="material-symbols-outlined" aria-hidden="true">shuffle</span>
            </button>
          </div>
          <input
            id="playlist-search"
            type="search"
            placeholder="Search tracks"
            aria-label="Search tracks in the current playlist"
            disabled
          >
          <p id="track-search-status" role="status" aria-live="polite" hidden></p>
          <ol id="tracks" aria-label="Playlist tracks"></ol>
        </section>
      </section>
    </main>
    <script>
      window.castApiAvailable = false;
      window.__onGCastApiAvailable = (isAvailable) => {
        window.castApiAvailable = isAvailable;
        window.dispatchEvent(new Event("cast-sdk-ready"));
      };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script>
      const form = document.querySelector("#url-form");
      const sidebar = document.querySelector(".sidebar");
      const sidebarToggle = document.querySelector("#sidebar-toggle");
      const sidebarContent = document.querySelector("#sidebar-content");
      const input = document.querySelector("#url");
      const loadButton = document.querySelector("#load-button");
      const previousButton = document.querySelector("#previous-button");
      const nextButton = document.querySelector("#next-button");
      const randomizeButton = document.querySelector("#randomize-button");
      const trackList = document.querySelector("#tracks");
      const playlistSearch = document.querySelector("#playlist-search");
      const trackSearchStatus = document.querySelector("#track-search-status");
      const status = document.querySelector("#status");
      const playlistTitle = document.querySelector("#playlist-title");
      const savedStatus = document.querySelector("#saved-status");
      const savedList = document.querySelector("#saved-playlists");
      const saveButton = document.querySelector("#save-button");
      const player = document.querySelector("#player");
      const castButton = document.querySelector("#cast-button");
      const castIcon = castButton.querySelector(".material-symbols-outlined");
      const playPauseButton = document.querySelector("#play-pause-button");
      const playPauseIcon = playPauseButton.querySelector(".material-symbols-outlined");
      const stopButton = document.querySelector("#stop-button");
      const seekSlider = document.querySelector("#seek-slider");
      const seekCurrentTime = document.querySelector("#seek-current-time");
      const seekDuration = document.querySelector("#seek-duration");
      const volumeSlider = document.querySelector("#volume-slider");
      const volumeValue = document.querySelector("#volume-value");
      const maxAudioLoadRetries = 2;
      const audioLoadError = "The audio stream could not be loaded.";
      const currentThumbnail = document.querySelector("#current-thumbnail");
      const logoutButton = document.querySelector("#logout-button");
      const ambientColors = ["#241f2a", "#1e2925", "#29231f", "#202734", "#192a2a", "#27232a"];
      let tracks = [];
      let currentIndex = -1;
      let ambientColorIndex = -1;
      let playbackRequest = 0;
      let playlistLoadRequest = 0;
      let cancelMetadataWait = null;
      let currentPlaylistUrl = "";
      let currentPlaylistTitle = "";
      let canSaveCurrentPlaylist = false;
      let castContext = null;
      let castSession = null;
      let remotePlayer = null;
      let remotePlayerController = null;
      let resolvedMedia = null;
      let isSeeking = false;

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) {
          return "0:00";
        }
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
      }

      function updateSeekProgress(value, duration) {
        const progress = Number.isFinite(duration) && duration > 0
          ? Math.min(100, Math.max(0, (value / duration) * 100))
          : 0;
        seekSlider.style.setProperty("--slider-progress", `${progress}%`);
      }

      function updateVolumeProgress(volume) {
        volumeSlider.style.setProperty("--slider-progress", `${volume * 100}%`);
      }

      function updatePlaybackControls() {
        const casting = Boolean(castSession);
        const hasRemoteMedia = casting && remotePlayer && remotePlayer.isMediaLoaded;
        const hasLocalMedia = !casting && Boolean(resolvedMedia);
        const hasMedia = hasRemoteMedia || hasLocalMedia;
        const duration = hasRemoteMedia
          ? remotePlayer.duration
          : hasLocalMedia
            ? player.duration
            : 0;
        const currentTime = hasRemoteMedia
          ? remotePlayer.currentTime
          : hasLocalMedia
            ? player.currentTime
            : 0;
        const canSeek = hasRemoteMedia
          ? remotePlayer.canSeek
          : hasLocalMedia && Number.isFinite(duration) && duration > 0;

        playPauseButton.disabled = !hasMedia;
        stopButton.disabled = !hasMedia;
        const shouldPlay = hasRemoteMedia
          ? remotePlayer.isPaused
          : hasLocalMedia && player.paused;
        playPauseIcon.textContent = shouldPlay ? "play_arrow" : "pause";
        playPauseButton.setAttribute("aria-label", shouldPlay ? "Play" : "Pause");
        playPauseButton.title = shouldPlay ? "Play" : "Pause";
        seekSlider.disabled = !canSeek;
        seekSlider.max = String(Number.isFinite(duration) ? duration : 0);
        seekDuration.textContent = formatTime(duration);
        updateSeekProgress(isSeeking ? Number(seekSlider.value) : currentTime, duration);
        if (!isSeeking) {
          seekSlider.value = String(Number.isFinite(currentTime) ? currentTime : 0);
          seekCurrentTime.value = formatTime(currentTime);
          seekCurrentTime.textContent = seekCurrentTime.value;
        }
      }

      function onRemotePlayerChanged() {
        updatePlaybackControls();
        if (remotePlayer && remotePlayer.title) {
          status.textContent = remotePlayer.title;
        }
      }

      function updateVolumeControl(volume) {
        if (!Number.isFinite(volume)) {
          return;
        }
        const normalizedVolume = Math.min(1, Math.max(0, volume));
        volumeSlider.value = String(normalizedVolume);
        updateVolumeProgress(normalizedVolume);
        volumeValue.value = `${Math.round(normalizedVolume * 100)}%`;
        volumeValue.textContent = volumeValue.value;
      }

      function syncCastVolume() {
        if (castSession) {
          const volume = castSession.getVolume();
          if (Number.isFinite(volume)) {
            updateVolumeControl(volume);
          }
        }
      }

      function onCastVolumeChanged() {
        syncCastVolume();
      }

      function updateCastUi() {
        const castLabel = castSession ? "Disconnect from Chromecast" : "Cast to Chromecast";
        castButton.disabled = !castContext;
        castIcon.textContent = castSession ? "cast_connected" : "cast";
        castButton.title = castContext
          ? castLabel
          : (window.isSecureContext
            ? "Casting is unavailable in this browser."
            : "Casting requires HTTPS; localhost is allowed.");
        castButton.setAttribute("aria-label", castContext ? castLabel : "Cast unavailable");
        updatePlaybackControls();
      }

      function loadCastMedia(media) {
        if (!castSession) {
          return;
        }

        const mediaInfo = new chrome.cast.media.MediaInfo(
          media.audioUrl,
          media.contentType,
        );
        const metadata = new chrome.cast.media.GenericMediaMetadata();
        metadata.title = media.title;
        if (media.thumbnailUrl) {
          metadata.images = [new chrome.cast.Image(media.thumbnailUrl)];
        }
        mediaInfo.metadata = metadata;

        const loadRequest = new chrome.cast.media.LoadRequest(mediaInfo);
        loadRequest.autoplay = true;
        status.textContent = `Sending ${media.title} to Chromecast…`;
        castSession.loadMedia(loadRequest).then(
          () => {
            if (resolvedMedia === media && castSession) {
              status.textContent = media.title;
            }
          },
          () => {
            if (resolvedMedia === media && castSession) {
              status.textContent = `Could not cast ${media.title}. The Chromecast may not support this audio stream.`;
              castContext.endCurrentSession(true);
            }
          },
        );
      }

      async function playLocally(media) {
        const metadataLoaded = waitForMetadata();
        player.src = media.audioUrl;
        player.load();
        await metadataLoaded;
        player.currentTime = 0;
        await player.play();
        status.textContent = media.title;
      }

      function initializeCast() {
        if (!window.castApiAvailable || !window.cast || !window.cast.framework) {
          castButton.disabled = true;
          castButton.title = window.isSecureContext
            ? "Casting is unavailable in this browser."
            : "Casting requires HTTPS; localhost is allowed.";
          castButton.setAttribute("aria-label", "Cast unavailable");
          return;
        }

        castContext = cast.framework.CastContext.getInstance();
        remotePlayer = new cast.framework.RemotePlayer();
        remotePlayerController = new cast.framework.RemotePlayerController(remotePlayer);
        [
          cast.framework.RemotePlayerEventType.CURRENT_TIME_CHANGED,
          cast.framework.RemotePlayerEventType.DURATION_CHANGED,
          cast.framework.RemotePlayerEventType.IS_MEDIA_LOADED_CHANGED,
          cast.framework.RemotePlayerEventType.IS_PAUSED_CHANGED,
          cast.framework.RemotePlayerEventType.PLAYER_STATE_CHANGED,
          cast.framework.RemotePlayerEventType.CAN_SEEK_CHANGED,
        ].forEach((eventType) => {
          remotePlayerController.addEventListener(eventType, onRemotePlayerChanged);
        });
        castContext.setOptions({
          receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
        });
        castContext.addEventListener(
          cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
          (event) => {
            if (
              event.sessionState === cast.framework.SessionState.SESSION_STARTED
              || event.sessionState === cast.framework.SessionState.SESSION_RESUMED
            ) {
              castSession = castContext.getCurrentSession();
              castSession.addEventListener(
                cast.framework.SessionEventType.VOLUME_CHANGED,
                onCastVolumeChanged,
              );
              updateCastUi();
              syncCastVolume();
              updatePlaybackControls();
              if (resolvedMedia) {
                player.pause();
                loadCastMedia(resolvedMedia);
              } else {
                status.textContent = "Connected to Chromecast. Select a track to play.";
              }
            } else if (
              event.sessionState === cast.framework.SessionState.SESSION_ENDED
            ) {
              castSession = null;
              updateCastUi();
              updateVolumeControl(player.volume);
              if (resolvedMedia) {
                playLocally(resolvedMedia).catch((error) => {
                  status.textContent = `Could not resume local playback: ${error.message}`;
                });
              }
            }
          },
        );
        castSession = castContext.getCurrentSession();
        if (castSession) {
          castSession.addEventListener(
            cast.framework.SessionEventType.VOLUME_CHANGED,
            onCastVolumeChanged,
          );
          syncCastVolume();
        }
        updateCastUi();
      }

      window.addEventListener("cast-sdk-ready", initializeCast);
      initializeCast();

      castButton.addEventListener("click", async () => {
        try {
          if (castSession) {
            castContext.endCurrentSession(true);
          } else if (castContext) {
            await castContext.requestSession();
          }
        } catch (error) {
          status.textContent = `Could not connect to Chromecast: ${error.message}`;
        }
      });

      volumeSlider.addEventListener("input", () => {
        const volume = Number(volumeSlider.value);
        updateVolumeControl(volume);
        if (castSession) {
          castSession.setVolume(volume).catch(() => {
            status.textContent = "Could not change Chromecast volume.";
          });
        } else {
          player.volume = volume;
        }
      });

      playPauseButton.addEventListener("click", async () => {
        try {
          if (castSession) {
            if (remotePlayer && remotePlayer.isMediaLoaded) {
              remotePlayerController.playOrPause();
            }
          } else if (player.paused) {
            await player.play();
          } else {
            player.pause();
          }
        } catch (error) {
          status.textContent = `Could not change playback: ${error.message}`;
        }
      });
      stopButton.addEventListener("click", () => {
        if (castSession) {
          if (remotePlayer && remotePlayer.isMediaLoaded) {
            remotePlayerController.stop();
          }
        } else if (resolvedMedia) {
          player.pause();
          player.currentTime = 0;
          status.textContent = "Stopped.";
        }
      });
      seekSlider.addEventListener("input", () => {
        isSeeking = true;
        const seekTime = Number(seekSlider.value);
        seekCurrentTime.value = formatTime(seekTime);
        seekCurrentTime.textContent = seekCurrentTime.value;
        updateSeekProgress(seekTime, Number(seekSlider.max));
      });
      seekSlider.addEventListener("change", () => {
        const seekTime = Number(seekSlider.value);
        isSeeking = false;
        if (castSession && remotePlayer && remotePlayer.isMediaLoaded) {
          remotePlayer.currentTime = seekTime;
          remotePlayerController.seek();
        } else if (resolvedMedia && Number.isFinite(player.duration)) {
          player.currentTime = seekTime;
          updatePlaybackControls();
        }
      });
      player.addEventListener("volumechange", () => {
        if (!castSession) {
          updateVolumeControl(player.volume);
        }
      });
      [
        "durationchange",
        "loadedmetadata",
        "pause",
        "play",
        "timeupdate",
      ].forEach((eventType) => {
        player.addEventListener(eventType, updatePlaybackControls);
      });
      updateVolumeControl(player.volume);
      updatePlaybackControls();

      logoutButton.addEventListener("click", async () => {
        try {
          const response = await fetch("/api/logout", { method: "POST" });
          if (!response.ok) {
            throw new Error("Could not sign out.");
          }
          window.location.assign("/login");
        } catch (error) {
          status.textContent = error.message;
        }
      });

      sidebarToggle.addEventListener("click", () => {
        const expanded = sidebarToggle.getAttribute("aria-expanded") === "true";
        sidebarToggle.setAttribute("aria-expanded", String(!expanded));
        sidebar.classList.toggle("is-collapsed", expanded);
        sidebarContent.hidden = expanded;
      });

      function shiftAmbientColor() {
        ambientColorIndex = (ambientColorIndex + 1) % ambientColors.length;
        const ambientColor = ambientColors[ambientColorIndex];
        document.body.style.setProperty("--ambient-color", ambientColor);
        player.style.setProperty("--ambient-color", ambientColor);
        seekSlider.style.setProperty("--ambient-color", ambientColor);
        volumeSlider.style.setProperty("--ambient-color", ambientColor);
      }

      function selectTrack(index) {
        if (index >= 0 && index < tracks.length && index !== currentIndex) {
          shiftAmbientColor();
        }
        playTrack(index);
      }

      function advanceTrack(index) {
        if (index >= 0 && index < tracks.length && index !== currentIndex) {
          shiftAmbientColor();
        }
        playTrack(index);
      }

      function renderTracks() {
        trackList.replaceChildren();
        const query = playlistSearch.value.trim().toLocaleLowerCase();
        const matchingTracks = tracks
          .map((track, index) => ({ track, index }))
          .filter(({ track }) => track.title.toLocaleLowerCase().includes(query));

        matchingTracks.forEach(({ track, index }) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = `${index + 1}. ${track.title}`;
          button.setAttribute("data-track-number", String(index + 1));
          button.setAttribute("aria-current", String(index === currentIndex));
          button.addEventListener("click", () => selectTrack(index));
          item.append(button);
          trackList.append(item);
        });
        trackSearchStatus.hidden = !query || matchingTracks.length > 0;
        trackSearchStatus.textContent = query
          ? `No tracks found for “${playlistSearch.value.trim()}”.`
          : "";
        previousButton.disabled = currentIndex <= 0;
        nextButton.disabled = currentIndex < 0 || currentIndex >= tracks.length - 1;
        randomizeButton.disabled = tracks.length < 2;
        playlistSearch.disabled = tracks.length === 0;
      }

      function clearPlayer() {
        if (cancelMetadataWait) {
          cancelMetadataWait();
        }
        player.pause();
        player.removeAttribute("src");
        player.load();
      }

      function waitForMetadata() {
        return new Promise((resolve, reject) => {
          function cleanup() {
            player.removeEventListener("loadedmetadata", onLoadedMetadata);
            player.removeEventListener("error", onError);
            if (cancelMetadataWait === cancel) {
              cancelMetadataWait = null;
            }
          }

          function onLoadedMetadata() {
            cleanup();
            resolve();
          }

          function onError() {
            cleanup();
            reject(new Error("The audio stream could not be loaded."));
          }

          function cancel() {
            cleanup();
            reject(new Error("Playback was replaced."));
          }

          cancelMetadataWait = cancel;
          player.addEventListener("loadedmetadata", onLoadedMetadata);
          player.addEventListener("error", onError);
        });
      }

      async function playTrack(index, retryCount = 0) {
        if (index < 0 || index >= tracks.length) {
          return;
        }
        const track = tracks[index];
        const requestId = ++playbackRequest;
        currentIndex = index;
        resolvedMedia = null;
        renderTracks();
        clearPlayer();
        currentThumbnail.hidden = true;
        currentThumbnail.removeAttribute("src");
        if (track.thumbnail_url) {
          currentThumbnail.dataset.thumbnailUrl = track.thumbnail_url;
          currentThumbnail.onload = () => {
            if (currentThumbnail.dataset.thumbnailUrl === track.thumbnail_url) {
              currentThumbnail.hidden = false;
            }
          };
          currentThumbnail.onerror = () => {
            if (currentThumbnail.dataset.thumbnailUrl === track.thumbnail_url) {
              currentThumbnail.hidden = true;
            }
          };
          currentThumbnail.src = track.thumbnail_url;
        } else {
          delete currentThumbnail.dataset.thumbnailUrl;
          currentThumbnail.onload = null;
          currentThumbnail.onerror = null;
        }
        status.textContent = `Resolving ${track.title}…`;

        try {
          const response = await fetch("/api/resolve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: track.url }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not resolve that track.");
          }
          if (requestId !== playbackRequest) {
            return;
          }

          resolvedMedia = {
            audioUrl: result.audio_url,
            contentType: result.content_type || "audio/mpeg",
            title: result.title,
            thumbnailUrl: track.thumbnail_url,
          };
          if (castSession) {
            player.pause();
            loadCastMedia(resolvedMedia);
            return;
          }

          const metadataLoaded = waitForMetadata();
          player.src = resolvedMedia.audioUrl;
          player.load();
          await metadataLoaded;
          if (requestId !== playbackRequest) {
            return;
          }
          player.currentTime = 0;
          await player.play();
          if (requestId === playbackRequest) {
            status.textContent = resolvedMedia.title;
            updatePlaybackControls();
          }
        } catch (error) {
          if (requestId === playbackRequest) {
            if (error.message === audioLoadError && retryCount < maxAudioLoadRetries) {
              status.textContent = `Retrying ${track.title} (${retryCount + 1}/${maxAudioLoadRetries})…`;
              await playTrack(index, retryCount + 1);
            } else if (error.message === audioLoadError && index < tracks.length - 1) {
              advanceTrack(index + 1);
            } else {
              status.textContent = `${track.title}: ${error.message}`;
            }
          }
        }
      }

      randomizeButton.addEventListener("click", () => {
        const currentTrack = tracks[currentIndex];
        for (let index = tracks.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [tracks[index], tracks[randomIndex]] = [tracks[randomIndex], tracks[index]];
        }
        currentIndex = currentTrack ? tracks.indexOf(currentTrack) : -1;
        renderTracks();
      });

      async function loadPlaylist(url, { allowSave = false } = {}) {
        url = url.trim();
        const loadRequestId = ++playlistLoadRequest;
        ++playbackRequest;
        clearPlayer();
        tracks = [];
        currentIndex = -1;
        playlistSearch.value = "";
        trackSearchStatus.hidden = true;
        trackSearchStatus.textContent = "";
        currentPlaylistUrl = "";
        currentPlaylistTitle = "";
        canSaveCurrentPlaylist = false;
        playlistTitle.textContent = "Loading playlist…";
        saveButton.disabled = true;
        renderTracks();
        loadButton.disabled = true;
        status.textContent = "Loading playlist…";

        try {
          const response = await fetch("/api/playlist", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not load that playlist.");
          }
          if (loadRequestId !== playlistLoadRequest) {
            return;
          }

          tracks = result.tracks;
          currentPlaylistUrl = url;
          currentPlaylistTitle = result.title;
          canSaveCurrentPlaylist = allowSave;
          playlistTitle.textContent = `${result.title} (${tracks.length} songs)`;
          saveButton.disabled = !canSaveCurrentPlaylist;
          renderTracks();
          status.textContent = `${result.title} — ${tracks.length} tracks`;
        } catch (error) {
          if (loadRequestId === playlistLoadRequest) {
            playlistTitle.textContent = "No playlist loaded";
            status.textContent = error.message;
          }
        } finally {
          if (loadRequestId === playlistLoadRequest) {
            loadButton.disabled = false;
          }
        }
      }

      async function refreshSavedPlaylists() {
        const response = await fetch("/api/saved-playlists");
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Could not load saved playlists.");
        }

        savedList.replaceChildren();
        result.playlists.forEach((playlist) => {
          const item = document.createElement("li");
          const openButton = document.createElement("button");
          openButton.type = "button";
          openButton.textContent = playlist.title;
          openButton.addEventListener("click", () => loadPlaylist(playlist.url));

          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.classList.add("material-symbols-outlined");
          removeButton.textContent = "delete";
          removeButton.title = `Remove ${playlist.title}`;
          removeButton.setAttribute("aria-label", `Remove ${playlist.title}`);
          removeButton.addEventListener("click", () => removeSavedPlaylist(playlist.url));
          item.append(openButton, removeButton);
          savedList.append(item);
        });
        savedStatus.textContent = result.playlists.length
          ? `${result.playlists.length} saved playlist(s).`
          : "No saved playlists yet.";
      }

      async function removeSavedPlaylist(url) {
        try {
          const response = await fetch("/api/saved-playlists", {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not remove the playlist.");
          }
          await refreshSavedPlaylists();
        } catch (error) {
          savedStatus.textContent = error.message;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        loadPlaylist(input.value, { allowSave: true });
      });

      previousButton.addEventListener("click", () => selectTrack(currentIndex - 1));
      nextButton.addEventListener("click", () => selectTrack(currentIndex + 1));
      playlistSearch.addEventListener("input", renderTracks);
      saveButton.addEventListener("click", async () => {
        if (!canSaveCurrentPlaylist || !currentPlaylistUrl) {
          return;
        }
        saveButton.disabled = true;
        savedStatus.textContent = "Saving playlist…";
        try {
          const response = await fetch("/api/saved-playlists", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: currentPlaylistTitle,
              url: currentPlaylistUrl,
            }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not save the playlist.");
          }
          await refreshSavedPlaylists();
          savedStatus.textContent = result.updated
            ? "Updated saved playlist."
            : "Playlist saved.";
        } catch (error) {
          savedStatus.textContent = error.message;
        } finally {
          saveButton.disabled = !canSaveCurrentPlaylist;
        }
      });
      player.addEventListener("ended", () => {
        if (currentIndex < tracks.length - 1) {
          advanceTrack(currentIndex + 1);
        } else if (currentIndex >= 0) {
          status.textContent = "Playlist finished.";
        }
      });

      refreshSavedPlaylists().catch((error) => {
        savedStatus.textContent = error.message;
      });
    </script>
  </body>
</html>
